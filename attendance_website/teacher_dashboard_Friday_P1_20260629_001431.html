<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Admin Attendance Dashboard</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #0f172a;
    }

    .dashboard {
      max-width: 1200px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0;
      color: #071e3d;
    }

    p {
      color: #64748b;
    }

    .section {
      margin-top: 24px;
      padding: 20px;
      border-radius: 14px;
      background: #f8fbff;
      border: 1px solid #dbe4ef;
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <h1>Main Admin Attendance Dashboard</h1>
    <p>Sreenidhi University Smart Attendance System</p>

    <div class="section">
      {{DASHBOARD_CONTENT}}
      {{SUMMARY}}
      {{REPORT_LINKS}}
      {{TABLE_ROWS}}
      {{CONTENT}}
    </div>
  </div>
</body>
</html>
