<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Report</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #0f172a;
    }

    .report {
      max-width: 1200px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      color: #071e3d;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 24px 0;
    }

    .box {
      padding: 18px;
      border-radius: 14px;
      background: #f8fbff;
      border: 1px solid #dbe4ef;
    }

    .box h2 {
      margin: 0;
      color: #0b3265;
    }

    .box p {
      margin: 6px 0 0;
      color: #64748b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #dbe4ef;
      text-align: left;
    }

    th {
      background: #f8fbff;
      color: #64748b;
      text-transform: uppercase;
      font-size: 12px;
    }

    .present {
      color: #116235;
      font-weight: bold;
    }

    .absent {
      color: #991b1b;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="report">
    <h1>Sreenidhi University Attendance Report</h1>
    <p>Generated by Smart Attendance System</p>

    <div>
      {{SUMMARY}}
      {{SUMMARY_CARDS}}
      {{ATTENDANCE_TABLE}}
      {{TABLE_ROWS}}
      {{CONTENT}}
    </div>
  </div>
</body>
</html>
